openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Driver authentication
  - name: driver-plans
    description: Driver subscription plan management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/send-otp:
    post:
      operationId: authSendOtp
      tags: [auth]
      summary: Send OTP to driver phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOtpRequest"
      responses:
        "200":
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendOtpResult"
        "400":
          description: Invalid phone number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "500":
          description: Firebase not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /auth/verify-otp:
    post:
      operationId: authVerifyOtp
      tags: [auth]
      summary: Verify OTP and get Firebase credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpRequest"
      responses:
        "200":
          description: OTP verified — returns Firebase email/password credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyOtpResult"
        "400":
          description: Missing fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "401":
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "500":
          description: Firebase not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /driver-plans/create-order:
    post:
      operationId: driverPlansCreateOrder
      tags: [driver-plans]
      summary: Create a Razorpay order for a driver plan
      description: >
        Creates a Razorpay payment order server-side. The mobile app receives
        the order ID and public key ID, then opens the Razorpay checkout.
        The Razorpay secret key is never exposed to the client.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "200":
          description: Razorpay order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResult"
        "400":
          description: Invalid driverUid or planType
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: Token UID does not match driverUid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "502":
          description: Razorpay API unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "503":
          description: Payment service not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /driver-plans/verify-payment:
    post:
      operationId: driverPlansVerifyPayment
      tags: [driver-plans]
      summary: Verify Razorpay payment and activate driver plan
      description: >
        Verifies the Razorpay payment signature using HMAC-SHA256.
        On valid signature, activates the plan in Firestore using server time.
        An invalid signature returns 400 — the plan is NOT activated.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPaymentRequest"
      responses:
        "200":
          description: Payment verified and plan activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyPaymentResult"
        "400":
          description: Missing fields or invalid signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: Token UID does not match driverUid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "500":
          description: Firestore write failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "503":
          description: Payment service not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID Token
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SendOtpRequest:
      type: object
      properties:
        phone:
          type: string
          description: 10-digit Indian mobile number (no country code)
          example: "9876543210"
      required:
        - phone
    SendOtpResult:
      type: object
      properties:
        sent:
          type: boolean
        devOtp:
          type: string
          description: OTP returned only in development mode
      required:
        - sent
    VerifyOtpRequest:
      type: object
      properties:
        phone:
          type: string
          example: "9876543210"
        otp:
          type: string
          example: "123456"
      required:
        - phone
        - otp
    VerifyOtpResult:
      type: object
      properties:
        token:
          type: string
          description: Firebase custom token — use with signInWithCustomToken
      required:
        - token
    ApiErrorBody:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    PlanType:
      type: string
      enum:
        - daily
        - weekly
        - monthly
      description: Driver subscription plan type
    CreateOrderRequest:
      type: object
      properties:
        driverUid:
          type: string
          description: Firebase UID of the driver (must match the bearer token)
          example: "919876543210"
        planType:
          $ref: "#/components/schemas/PlanType"
      required:
        - driverUid
        - planType
    CreateOrderResult:
      type: object
      properties:
        razorpayOrderId:
          type: string
          description: Razorpay order ID — pass to the checkout SDK
          example: "order_PFa1YbZFwpXmqA"
        amount:
          type: integer
          description: Amount in paise (300 = ₹3, 1900 = ₹19, 10000 = ₹100)
          example: 1900
        currency:
          type: string
          description: ISO 4217 currency code
          example: "INR"
        keyId:
          type: string
          description: Razorpay public key ID — safe to expose to client
          example: "rzp_test_xxxxxxxxxxxxxxxx"
      required:
        - razorpayOrderId
        - amount
        - currency
        - keyId
    VerifyPaymentRequest:
      type: object
      properties:
        driverUid:
          type: string
          description: Firebase UID of the driver (must match the bearer token)
          example: "919876543210"
        planType:
          $ref: "#/components/schemas/PlanType"
        razorpayOrderId:
          type: string
          description: Order ID from create-order step
          example: "order_PFa1YbZFwpXmqA"
        razorpayPaymentId:
          type: string
          description: Payment ID from Razorpay checkout success callback
          example: "pay_PFa1YcZGwqYnrB"
        razorpaySignature:
          type: string
          description: HMAC-SHA256 signature from Razorpay checkout success callback
          example: "9ef4dabb9e..."
      required:
        - driverUid
        - planType
        - razorpayOrderId
        - razorpayPaymentId
        - razorpaySignature
    VerifyPaymentResult:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        planStartAt:
          type: integer
          description: Unix timestamp (ms) when the plan started — server time
          example: 1748908800000
        planExpiryAt:
          type: integer
          description: Unix timestamp (ms) when the plan expires — server time
          example: 1749513600000
      required:
        - ok
        - planStartAt
        - planExpiryAt
