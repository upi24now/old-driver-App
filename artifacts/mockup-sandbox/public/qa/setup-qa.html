<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Setup PIN — Visual QA</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #cfd4da;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; gap: 40px; padding: 40px; align-items: flex-start; justify-content: center;
  }
  .label { text-align:center; font-weight:700; color:#374151; margin-bottom:10px; font-size:14px; }
  .phone {
    background:#FFFFFF; border-radius:38px; overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.28); position:relative;
  }
  .phone.medium { width:390px; height:844px; }
  .phone.small  { width:360px; height:640px; }
  .statusbar { height:30px; display:flex; align-items:center; justify-content:space-between; padding:0 22px; font-size:13px; font-weight:700; color:#172033; }
  .scroll { padding-left:22px; padding-right:22px; display:flex; flex-direction:column; align-items:center; }
  .phone.medium .scroll { padding-top:18px; padding-bottom:22px; }
  .phone.small  .scroll { padding-top:12px; padding-bottom:12px; }

  .setupHero { width:100%; position:relative; display:flex; align-items:center; justify-content:center; }
  .phone.medium .setupHero { height:252px; margin-top:8px; margin-bottom:10px; }
  .phone.small  .setupHero { height:218px; margin-top:4px; margin-bottom:6px; }
  .setupHero svg { position:absolute; inset:0; width:100%; height:100%; }
  .scooter { position:relative; z-index:2; object-fit:contain; }
  .phone.medium .scooter { width:257px; height:172px; margin-top:28px; }
  .phone.small  .scooter { width:238px; height:150px; margin-top:20px; }

  .brandBlock { display:flex; flex-direction:column; align-items:center; }
  .phone.medium .brandBlock { margin-bottom:14px; }
  .phone.small  .brandBlock { margin-bottom:10px; }
  .brandWordmark { font-size:28px; font-weight:800; letter-spacing:-0.6px; margin-bottom:6px; }
  .partnerRow { display:flex; flex-direction:row; align-items:center; gap:10px; }
  .partnerLine { width:26px; height:1.5px; border-radius:1px; background:#F0C9AE; }
  .partnerWord { font-size:11px; font-weight:700; color:#FF6A00; letter-spacing:4px; }

  .setupHeadline { font-size:28px; font-weight:800; color:#172033; letter-spacing:-0.5px; text-align:center; margin-bottom:8px; }
  .setupSubtitle { font-size:14px; color:#6B7280; text-align:center; line-height:20px; margin-bottom:24px; }

  .floatCard { align-self:stretch; width:100%; background:#FFFFFF; border-radius:24px; padding:22px;
    border:1px solid #F1F1F1; box-shadow:0 8px 18px rgba(27,39,51,.07); margin-bottom:16px; }
  .setupCardLabel { font-size:14px; font-weight:700; color:#172033; margin-bottom:12px; }
  .inputRow { display:flex; flex-direction:row; align-items:center; border:1.5px solid #E8E8E8;
    border-radius:14px; height:62px; padding:0 12px; background:#FBFBFB; }
  .countryPill { display:flex; flex-direction:row; align-items:center; gap:4px; }
  .flagEmoji { font-size:18px; line-height:24px; }
  .countryCode { font-size:15px; font-weight:700; color:#172033; }
  .inputDivider { width:1.5px; height:22px; background:#E8E8E8; margin:0 12px; }
  .phoneVal { flex:1; font-size:16px; font-weight:500; color:#172033; }

  .setupTrustRow { display:flex; flex-direction:row; align-items:center; justify-content:center; gap:8px; padding:0 6px; margin-top:14px; margin-bottom:22px; }
  .setupTrustText { font-size:13px; color:#6B7280; text-align:center; }

  .setupBtnWrap { align-self:stretch; width:100%; border-radius:18px; margin-bottom:20px; box-shadow:0 10px 18px rgba(255,106,0,.40); }
  .setupBtn { height:58px; border-radius:18px; display:flex; flex-direction:row; align-items:center; justify-content:center; gap:10px;
    background:linear-gradient(135deg,#FF6A00,#F25600); }
  .setupBtnText { font-size:18px; font-weight:800; color:#FFFFFF; letter-spacing:0.2px; }

  .termsRow { display:flex; flex-direction:row; flex-wrap:wrap; align-items:center; justify-content:center; gap:1px; }
  .termsText { font-size:12px; color:#6B7280; }
  .termsLink { font-size:12px; font-weight:700; color:#FF6A00; }

  .backToPin { display:flex; flex-direction:row; align-items:center; justify-content:center; gap:6px; margin-top:16px; padding:9px 14px; }
  .backToPinText { font-size:14px; font-weight:700; color:#172033; }
</style>
</head>
<body>
  <div>
    <div class="label">Medium (390×844)</div>
    <div class="phone medium" id="m"></div>
  </div>
  <div>
    <div class="label">Small Android (360×640)</div>
    <div class="phone small" id="s"></div>
  </div>

<script>
const INDIA = "M132 40 C140 30 150 30 158 36 C172 30 188 32 200 42 C214 38 232 40 246 50 C256 56 258 64 250 70 C244 74 250 84 258 96 C268 110 272 124 264 138 C252 158 236 178 220 196 C208 208 196 218 186 222 C182 218 178 206 174 196 C166 176 156 158 146 142 C134 124 120 116 106 110 C92 104 80 100 74 92 C68 86 72 78 82 78 C96 78 108 84 120 80 C128 76 128 56 132 40 Z";

function pin(x,y,s){ return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 12 C-6 4 -7 -2 -3 -6 C-1 -8 1 -8 3 -6 C7 -2 6 4 0 12 Z" fill="#FF6A00" opacity="0.85"/><circle cx="0" cy="-2" r="2.1" fill="#FFFFFF" opacity="0.95"/></g>`; }

const SVG = `
<svg viewBox="0 0 360 260" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE0CB" stop-opacity="0.62"/>
      <stop offset="0.45" stop-color="#FFCDA8" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFEADD" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="platformGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF6A00" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FF6A00" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="indiaClip"><path d="${INDIA}"/></clipPath>
  </defs>
  <ellipse cx="296" cy="44" rx="30" ry="12" fill="#FFFFFF" opacity="0.55"/>
  <ellipse cx="276" cy="50" rx="20" ry="9"  fill="#FFFFFF" opacity="0.45"/>
  <ellipse cx="318" cy="52" rx="18" ry="8"  fill="#FFE6D6" opacity="0.5"/>
  <path d="${INDIA}" fill="url(#glassFill)"/>
  <g clip-path="url(#indiaClip)">
    <rect x="60" y="20" width="240" height="210" fill="#FF8A3D" opacity="0.05"/>
    <line x1="120" y1="92"  x2="178" y2="78"  stroke="#FF6A00" stroke-width="1" stroke-dasharray="2,5" opacity="0.28"/>
    <line x1="178" y1="78"  x2="236" y2="104" stroke="#FF6A00" stroke-width="1" stroke-dasharray="2,5" opacity="0.28"/>
    <line x1="120" y1="92"  x2="150" y2="150" stroke="#FF6A00" stroke-width="1" stroke-dasharray="2,5" opacity="0.24"/>
    <line x1="236" y1="104" x2="206" y2="170" stroke="#FF6A00" stroke-width="1" stroke-dasharray="2,5" opacity="0.24"/>
    <g opacity="0.22">
      <rect x="118" y="150" width="40" height="56" rx="2" fill="#E07B2C"/>
      <path d="M128 206 v-34 a10 10 0 0 1 20 0 v34 Z" fill="#FFF1E6" opacity="0.85"/>
      <rect x="116" y="146" width="44" height="6" rx="2" fill="#E07B2C"/>
    </g>
    <g opacity="0.20" fill="#E8852F">
      <rect x="92" y="168" width="14" height="40" rx="2"/>
      <ellipse cx="99" cy="168" rx="8" ry="9"/>
      <rect x="160" y="172" width="12" height="34" rx="2"/>
      <ellipse cx="166" cy="172" rx="6.5" ry="7"/>
    </g>
    <g opacity="0.20" fill="#E8852F">
      <rect x="228" y="150" width="14" height="58" rx="2"/>
      <rect x="244" y="162" width="11" height="46" rx="2"/>
      <rect x="258" y="172" width="9"  height="36" rx="2"/>
      <path d="M235 150 l-6 -16 l6 0 Z"/>
    </g>
    <g opacity="0.18" fill="#E8852F">
      <path d="M186 150 l5 -22 l5 22 Z"/>
      <path d="M200 154 l4 -16 l4 16 Z"/>
    </g>
  </g>
  <path d="${INDIA}" fill="none" stroke="#FF8A3D" stroke-width="7"   opacity="0.10"/>
  <path d="${INDIA}" fill="none" stroke="#FF8A3D" stroke-width="3.5" opacity="0.26"/>
  <path d="${INDIA}" fill="none" stroke="#FFDFC6" stroke-width="1.4" opacity="0.7"/>
  ${pin(120,86,1)}${pin(178,72,1.05)}${pin(236,98,1)}${pin(150,146,0.95)}${pin(206,166,0.95)}
  <ellipse cx="180" cy="224" rx="118" ry="26" fill="url(#platformGlow)"/>
  <ellipse cx="180" cy="226" rx="92"  ry="16" fill="none" stroke="#FF8A3D" stroke-width="1.4" opacity="0.45"/>
  <ellipse cx="180" cy="226" rx="74"  ry="11" fill="none" stroke="#FFC9A6" stroke-width="1"   opacity="0.6"/>
  <ellipse cx="180" cy="232" rx="60"  ry="7"  fill="#FF6A00" opacity="0.12"/>
</svg>`;

const shield = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FF6A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`;
const arrowR = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`;
const arrowL = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#172033" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>`;

function screen(){
  return `
  <div class="statusbar"><span>9:41</span><span>📶 🔋 100%</span></div>
  <div class="scroll">
    <div class="setupHero">${SVG}<img class="scooter" src="scooter-hero.png" alt="scooter"/></div>
    <div class="brandBlock">
      <div class="brandWordmark"><span style="color:#172033">Bike</span><span style="color:#FF6A00">Courier</span></div>
      <div class="partnerRow"><div class="partnerLine"></div><div class="partnerWord">PARTNER</div><div class="partnerLine"></div></div>
    </div>
    <div class="setupHeadline">Set up your PIN</div>
    <div class="setupSubtitle">Verify your number with OTP to create your PIN</div>
    <div class="floatCard">
      <div class="setupCardLabel">Mobile Number</div>
      <div class="inputRow">
        <div class="countryPill"><span class="flagEmoji">🇮🇳</span><span class="countryCode">+91</span></div>
        <div class="inputDivider"></div>
        <div class="phoneVal">8299013350</div>
      </div>
    </div>
    <div class="setupTrustRow">${shield}<span class="setupTrustText">Your number is used only for secure login and delivery updates.</span></div>
    <div class="setupBtnWrap"><div class="setupBtn"><span class="setupBtnText">Continue</span>${arrowR}</div></div>
    <div class="termsRow"><span class="termsText">By continuing, you agree to our </span><span class="termsLink">Terms</span><span class="termsText"> & </span><span class="termsLink">Privacy Policy</span></div>
    <div class="backToPin">${arrowL}<span class="backToPinText">Back to PIN login</span></div>
  </div>`;
}
document.getElementById("m").innerHTML = screen();
document.getElementById("s").innerHTML = screen();
</script>
</body>
</html>
